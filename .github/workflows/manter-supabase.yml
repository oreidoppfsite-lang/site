# O Supabase grátis pausa o projeto depois de ~7 dias sem uso.
# A cada 3 dias esta tarefa lê um post do banco, o que conta como uso.
name: Manter o Supabase ativo

on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ler um post do banco
        # chave publishable: é pública de propósito (a mesma que está no site)
        run: |
          curl -fsS "https://vktidxurujnhcnhauqmj.supabase.co/rest/v1/posts?select=id&limit=1" \
            -H "apikey: sb_publishable_cG9ok0PIix_s2iqkFG79NA_puTqa8x1" > /dev/null
